[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trader-bot"
version = "1.0.0"
description = "H4-Donchian-Trend — a conservative trend-following forex bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
live = ["requests>=2.28"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
trader-bot-backtest = "trader_bot.live:main"
